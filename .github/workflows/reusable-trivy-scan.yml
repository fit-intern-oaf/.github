name: Reusable — Trivy scan
on:
  workflow_call:
    inputs:
      image-ref:
        description: 'Container image to scan (fully qualified). Empty → filesystem-only.'
        type: string
        default: ""
      severity:
        type: string
        default: "HIGH,CRITICAL"
      exit-code:
        type: string
        default: "1"

permissions:
  contents: read
  security-events: write

jobs:
  fs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          severity: ${{ inputs.severity }}
          exit-code: ${{ inputs.exit-code }}
          ignore-unfixed: true
          format: sarif
          output: trivy-fs.sarif
      - uses: github/codeql-action/upload-sarif@v4
        # SARIF upload hits the GitHub code-scanning API which requires GHAS
        # on private repos. Skip on private; trivy itself still fails the build
        # on HIGH/CRITICAL via exit-code. Auto-enables after promotion to the
        # public consortium org.
        if: always() && github.event.repository.visibility == 'public'
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  image:
    if: inputs.image-ref != ''
    runs-on: ubuntu-latest
    steps:
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ inputs.image-ref }}
          severity: ${{ inputs.severity }}
          exit-code: ${{ inputs.exit-code }}
          ignore-unfixed: true
          format: sarif
          output: trivy-image.sarif
      - uses: github/codeql-action/upload-sarif@v4
        if: always() && github.event.repository.visibility == 'public'
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
