name: Reusable — Lint
on:
  workflow_call:
    inputs:
      python-version:
        description: Python version to use for linting Python code
        type: string
        default: "3.12"
      node-version:
        type: string
        default: "20"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.6.9 yamllint==1.35.1 mdformat==0.7.17
          npm install -g markdownlint-cli@0.42.0 prettier@3.3.3

      - name: Ruff (Python)
        if: hashFiles('**/*.py') != ''
        run: ruff check .

      - name: yamllint
        if: hashFiles('**/*.yml', '**/*.yaml') != ''
        run: yamllint -s .

      - name: markdownlint
        if: hashFiles('**/*.md') != ''
        run: markdownlint '**/*.md' --ignore node_modules

      - name: Prettier (JS/TS/JSON)
        if: hashFiles('**/*.ts', '**/*.tsx', '**/*.js', '**/*.jsx', '**/*.json') != ''
        run: prettier --check .
