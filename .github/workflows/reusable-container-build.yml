name: Reusable — Container build + SBOM + sign
on:
  workflow_call:
    inputs:
      image-name:
        description: 'Image name without registry prefix, e.g. connector-edc'
        type: string
        required: true
      context:
        type: string
        default: '.'
      dockerfile:
        type: string
        default: './Dockerfile'
      push:
        type: boolean
        default: true

permissions:
  contents: read
  packages: write
  id-token: write   # keyless cosign
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: inputs.push
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ inputs.image-name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=long
            type=semver,pattern={{version}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: false   # we generate with syft explicitly below

      - name: Install syft + cosign
        if: inputs.push
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin v1.14.1
          curl -sSfL -o /usr/local/bin/cosign \
            https://github.com/sigstore/cosign/releases/download/v2.4.1/cosign-linux-amd64
          chmod +x /usr/local/bin/cosign

      - name: Generate SBOM (SPDX JSON) with syft
        if: inputs.push
        run: |
          syft "ghcr.io/${{ github.repository_owner }}/${{ inputs.image-name }}@${{ steps.build.outputs.digest }}" \
            -o spdx-json=sbom.spdx.json

      - name: Attach SBOM attestation
        if: inputs.push
        run: |
          cosign attest --yes --predicate sbom.spdx.json --type spdxjson \
            "ghcr.io/${{ github.repository_owner }}/${{ inputs.image-name }}@${{ steps.build.outputs.digest }}"

      - name: Sign image (keyless OIDC)
        if: inputs.push
        run: |
          cosign sign --yes \
            "ghcr.io/${{ github.repository_owner }}/${{ inputs.image-name }}@${{ steps.build.outputs.digest }}"
